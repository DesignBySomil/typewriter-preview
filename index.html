<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OLIVETTI // LETTERA 32 — Interactive 3D Mechanical Typewriter</title>
  <link rel="icon" href="https://somiljain.com/home/assets/bRSSLNwJFPHa70scxuQ219zXuw.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="https://somiljain.com/home/assets/RsmqxPyZiTdTY5S7eQHBNQ6ou68.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="https://somiljain.com/home/assets/RsmqxPyZiTdTY5S7eQHBNQ6ou68.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="webgl-container"></div>

  <!-- Top Telemetry Header & Controls -->
  <header id="top-bar">
    <div class="brand-block">
      <div class="brand-name">LETTERA 32 // MECHANICAL TELEMETRY</div>
      <div class="brand-meta">44-BAR SEGMENT BASKET · INTERACTIVE 3D HARDWARE · BICHROME RIBBON [TAB]</div>
    </div>
    <div class="hud-controls">
      <button id="btn-ribbon" class="hud-btn" title="Cycle Black / Red / Stencil Ribbon (Tab)">RIBBON: BLK</button>
      <button id="btn-sheet" class="hud-btn" title="Pull Out / Insert Archival Sheet">NEW SHEET</button>
      <button id="btn-print-save" class="hud-btn" title="Export or Print Typed Page (Ctrl/Cmd+P)">PRINT / SAVE</button>
      <button id="btn-auto" class="hud-btn" title="Type a short note automatically">AUTO</button>
      <button id="btn-return" class="hud-btn" title="Carriage Return (Enter)">CR / LF ↵</button>
      <button id="btn-mute" class="hud-btn active" title="Toggle Synthesized Mechanical Audio">AUDIO: ON</button>
    </div>
  </header>

  <div id="export-backdrop" class="hidden"></div>
  <!-- PRINT / SAVE Export Modal Panel -->
  <div id="print-save-panel" class="export-panel hidden" role="dialog" aria-label="Print or Save Page">
    <div class="export-panel-header">
      <span id="export-title">EXPORT TYPED SHEET</span>
      <button id="btn-export-close" class="export-close-btn" title="Close (Escape)">✕</button>
    </div>
    <div class="export-preview-wrap"><img id="export-preview" alt="Preview of your typed sheet" /></div>
    <div class="export-panel-body">
      <button id="btn-export-png" class="export-action-btn">Download PNG</button>
      <button id="btn-export-pdf" class="export-action-btn">Download PDF</button>
    </div>
  </div>

  <!-- Full-screen SVG Telemetry HUD -->
  <svg id="hud-overlay" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="dot-bloom" x="-150%" y="-150%" width="400%" height="400%">
        <feGaussianBlur stdDeviation="2.8" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <g id="hud-corners"></g>

    <g id="hud-leaders">
      <polyline id="leader-carriage" class="leader-line" points="0,0 0,0 0,0" />
      <circle id="dot-carriage" class="leader-dot" cx="0" cy="0" r="3" filter="url(#dot-bloom)" />

      <polyline id="leader-basket" class="leader-line" points="0,0 0,0 0,0" />
      <circle id="dot-basket" class="leader-dot" cx="0" cy="0" r="3" filter="url(#dot-bloom)" />

      <polyline id="leader-platen" class="leader-line" points="0,0 0,0 0,0" />
      <circle id="dot-platen" class="leader-dot" cx="0" cy="0" r="3" filter="url(#dot-bloom)" />

      <polyline id="leader-ribbon" class="leader-line" points="0,0 0,0 0,0" />
      <circle id="dot-ribbon" class="leader-dot" cx="0" cy="0" r="3" filter="url(#dot-bloom)" />
    </g>

    <g id="hud-cards-group">
      <g id="card-carriage" transform="translate(14, 44)">
        <rect id="box-carriage" class="hud-box" x="0" y="0" width="148" height="52" rx="2" />
        <text class="hud-title" x="8" y="13">CARRIAGE POS</text>
        <text id="hud-val-carriage" class="hud-value" x="8" y="28">0.0 mm [01/46]</text>
        <text id="hud-val-bell" class="hud-sub" x="8" y="43">BELL IN: 38 CHARS</text>
      </g>

      <g id="card-platen" transform="translate(14, 104)">
        <rect class="hud-box" x="0" y="0" width="148" height="52" rx="2" />
        <text class="hud-title" x="8" y="13">PLATEN // PAGE</text>
        <text id="hud-val-line" class="hud-value" x="8" y="28">LINE 01 / 25</text>
        <text id="hud-val-case" class="hud-sub" x="8" y="43">BASKET: LOWER</text>
      </g>

      <g id="card-basket" transform="translate(14, 174)">
        <rect class="hud-box" x="0" y="0" width="148" height="70" rx="2" />
        <text class="hud-title" x="8" y="13">TYPEBASKET</text>
        <text id="hud-val-lastkey" class="hud-value" x="8" y="27">LAST: [NONE]</text>
        <text id="hud-val-strikes" class="hud-sub" x="8" y="40">STRIKES: 0000</text>
        <polyline id="hud-sparkline" fill="none" stroke="#72d6c9" stroke-width="1.3" points="8,62 140,62" />
      </g>

      <g id="card-ribbon" transform="translate(14, 254)">
        <rect class="hud-box" x="0" y="0" width="148" height="52" rx="2" />
        <text class="hud-title" x="8" y="13">BICHROME RIBBON</text>
        <text id="hud-val-ribbon" class="hud-value" x="8" y="28">BLK // 100.0%</text>
        <text id="hud-val-spool" class="hud-sub" x="8" y="43">SPOOL: 0.00 RAD</text>
      </g>
    </g>
  </svg>

  <!-- Mobile Portrait Action Bar & Prominent Keyboard Trigger -->
  <button id="btn-kb-big" class="mobile-kb-cta" type="button">OPEN KEYBOARD ⌨</button>

  <!-- Compact One-Line Readout for Small / Portrait Screens -->
  <div id="compact-telemetry">
    <span id="compact-col">POS: 0.0mm</span>
    <span id="compact-line">LN: 01/25</span>
    <span id="compact-key">KEY: -</span>
    <span id="compact-bell">BELL: 38</span>
    <div class="compact-actions">
      <button id="btn-kb-m" class="hud-btn" type="button" aria-label="Keyboard" title="Keyboard">&#9000;</button>
      <button id="btn-sheet-m" class="hud-btn" type="button" aria-label="New sheet" title="New sheet">&#9636;</button>
      <button id="btn-print-save-m" class="hud-btn" type="button" aria-label="Save" title="Save">&#8681;</button>
    </div>
  </div>

  <!-- Center Intro Prompt -->
  <div id="intro-prompt">
    <div class="prompt-pill">TAP KEYS, DRAG LEVERS &amp; KNOBS, OR TYPE</div>
    <div class="prompt-sub">DRAG RETURN LEVER · TURN KNOBS · SLIDE MARGIN STOPS · TAP PAPER TO EJECT</div>
  </div>

  <!-- Hidden input for mobile virtual keyboard support -->
  <input id="mobile-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />

  <script>
  (function(){var vv=window.visualViewport;if(!vv)return;
  function fit(){var c=document.getElementById('webgl-container');if(!c)return;
    var full=Math.max(window.innerHeight,screen.height&&window.innerWidth<820?window.innerHeight:0);
    var kb=vv.height<window.innerHeight*0.8;
    if(kb){var sh=(window.innerHeight-vv.height)*0.55;c.style.transform='translateY('+(vv.offsetTop-sh)+'px)';document.body.classList.add('kb-up');}
    else{c.style.transform='';document.body.classList.remove('kb-up');}}
  vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);})();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
